<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Location</title>
  <style>
    #map {
      width: 100%;
      height: 400px;
      margin-top: 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Location</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="location.html">Location</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Map</h2>
      <div id="map">
        <iframe id="google_map" width="100%" height="400" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="https://maps.google.co.uk?output=embed"></iframe>
      </div>
      <p><a href="#" onclick="getLocation()">Get My Current Location</a></p>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Samuel Shine | Date: June 28, 2025</p>
  </footer>
  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition);
      } else {
        document.getElementById("output").innerText = "Geolocation is not supported by this browser.";
      }
      return false;
    }

    function showPosition(pos) {
      var latitude = pos.coords.latitude;
      var longitude = pos.coords.longitude;
      var coords = latitude + ',' + longitude;
      document.getElementById('google_map').setAttribute('src', 'https://maps.google.co.uk?q=' + coords + '&z=15&output=embed');
    }
  </script>
</body>
</html>
