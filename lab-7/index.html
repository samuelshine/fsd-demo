<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bangalore Restaurants Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-extrabold text-gray-800">
        🍽️ Bangalore Restaurants Explorer
      </h1>
      <nav class="space-x-4 text-sm font-medium text-gray-600">
        <a href="#" class="hover:text-blue-600">Home</a>
        <a href="#" class="hover:text-blue-600">About</a>
        <a href="#" class="hover:text-blue-600">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <div class="max-w-3xl mx-auto pt-8 px-4">
      
      <!-- Filters -->
      <div class="bg-white rounded-lg shadow p-4 mb-8 flex flex-col md:flex-row gap-4 md:gap-8 items-center">
        <input type="text" id="searchName" placeholder="Search by name..." class="border outline-none rounded px-3 py-2 w-full max-w-[220px]"/>
        
        <select id="locationSelect" class="border rounded px-3 py-2 w-full max-w-[220px]">
            <option value="">All locations</option>
            <option>Basavanagudi</option>
            <option>Ashok Nagar</option>
            <option>Museum Road</option>
            <option>Indiranagar</option>
            <option>Koramangala</option>
            <option>Residency Road</option>
            <option>Church Street</option>
            <option>Lalbagh Road</option>
            <option>Lavelle Road</option>
            <option>Old Airport Road</option>
            <option>The Oberoi</option>
            <option>Hennur</option>
            <option>MG Road</option>
            <option>St. Mark’s Road</option>
            <option>JP Nagar</option>
            <option>Jayanagar</option>
            <option>Multiple locations</option>
            <option>Bannerghatta Road</option>
            <option>UB City</option>
        </select>

        
        <select id="openSelect" class="border rounded px-3 py-2 w-full max-w-[220px]">
          <option value="">All</option>
          <option value="true">Open to Public</option>
          <option value="false">Closed</option>
        </select>
        
        <button id="searchBtn" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-800 font-semibold">Search</button>
      </div>
      
      <!-- Results -->
      <div id="results" class="space-y-6">
        <!-- Will be injected by JS -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t mt-8">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between text-gray-600 text-sm">
      <p>© 2025 Bangalore Restaurants Explorer. All rights reserved.</p>
      <p>Built using TailwindCSS & Vanilla JS</p>
    </div>
  </footer>

  <script>
    const apiBase = "http://localhost:8000";

    const resultsDiv = document.getElementById('results');
    const searchBtn = document.getElementById('searchBtn');
    const searchNameInp = document.getElementById('searchName');
    const locationSelect = document.getElementById('locationSelect');
    const openSelect = document.getElementById('openSelect');

    // Helper to render restaurants
    function renderRestaurants(restaurants) {
      resultsDiv.innerHTML = '';
      if (!restaurants.length) {
        resultsDiv.innerHTML = `<div class="text-center text-gray-400">No results found.</div>`;
        return;
      }

      restaurants.forEach(r => {
        resultsDiv.innerHTML += `
          <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-2">
              <div>
                <h2 class="text-lg md:text-xl font-bold text-gray-900">${r.name}</h2>
                <div class="text-sm text-gray-500">${r.location}</div>
              </div>
              <span class="inline-block px-3 py-1 rounded-full ${
                r.is_open_to_public
                  ? 'bg-green-100 text-green-800'
                  : 'bg-red-100 text-red-800'
              } font-medium text-xs">
                ${r.is_open_to_public ? 'Open to Public' : 'Closed'}
              </span>
            </div>
            <div class="text-gray-700 mb-2">
              ${r.details.find(d => d.description)?.description || ''}
            </div>
            <div class="text-blue-900 italic">
              ${r.details.find(d => d.fun_fact)?.fun_fact || ''}
            </div>
          </div>
        `;
      });
    }

    // Fetch with filters
    async function fetchRestaurants({ name = '', location = '', open = '' } = {}) {
      // Search by name if filled (partial match supported backend)
      if (name.trim()) {
        const resp = await fetch(`${apiBase}/api/name/${encodeURIComponent(name.trim())}`);
        if (resp.ok) return resp.json();
        return [];
      }
      // Otherwise filter via query
      const params = [];
      if (location) params.push(`location=${encodeURIComponent(location)}`);
      if (open !== '') params.push(`is_open_to_public=${open}`);
      const queryString = params.length ? '?' + params.join('&') : '';
      const resp = await fetch(`${apiBase}/api${queryString}`);
      if (resp.ok) return resp.json();
      return [];
    }

    async function handleSearch() {
      const name = searchNameInp.value;
      const location = locationSelect.value;
      const open = openSelect.value;
      const data = await fetchRestaurants({ name, location, open });
      renderRestaurants(data);
    }

    searchBtn.addEventListener('click', handleSearch);
    searchNameInp.addEventListener('keypress', e => {
      if (e.key === 'Enter') searchBtn.click();
    });

    handleSearch();
  </script>
</body>
</html>
